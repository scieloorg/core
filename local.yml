version: "3"

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: scielo_core_local_django
    container_name: scielo_core_local_django
    depends_on:
      - redis
      - postgres
      - mailhog
      - solr
    links:
      - solr
    volumes:
      - .:/app:z
      - tmp_csv_data:/tmp
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8009:8000"
    command: /start

  solr:
    image: solr:9.3
    restart: always
    ports:
      - "8983:8983"
    volumes:
        - ./index:/var/solr
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx512m
      - SOLR_HEAP=512m

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: scielo_core_local_postgres
    container_name: scielo_core_local_postgres
    volumes:
      - ../scms_data/scielo_core/data_dev:/var/lib/postgresql/data:Z
      - ../scms_data/scielo_core/data_dev_backup:/backups:z
    ports:
      - "5439:5432"
    env_file:
      - ./.envs/.local/.postgres

  adminer:
    image: adminer
    container_name: scielo_core_local_adminer
    ports:
      - "8089:8080"

  # docs:
  #   image: scielo_core_local_docs
  #   container_name: scielo_core_local_docs
  #   build:
  #     context: .
  #     dockerfile: ./compose/local/docs/Dockerfile
  #   env_file:
  #     - ./.envs/.local/.django
  #   volumes:
  #     - ./docs:/docs:z
  #     - ./config:/app/config:z
  #     - ./core:/app/core:z
  #   ports:
  #     - "9000:9000"
  #   command: /start-docs

  mailhog:
    image: mailhog/mailhog:v1.0.0
    container_name: scielo_core_local_mailhog
    ports:
      - "8029:8025"

  redis:
    image: redis:6
    container_name: scielo_core_local_redis
    ports:
      - "6399:6379"

  # OpenSearch — sink opcional para os logs estruturados da aplicação.
  # Habilite em ``.envs/.local/.django`` com ``USE_OPENSEARCH_LOGGING=yes``
  # para que o handler ``OpenSearchLogHandler`` envie os logs para cá.
  # Configurado como single-node, com a camada de segurança desabilitada
  # para uso somente em desenvolvimento (NÃO usar em produção).
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: scielo_core_local_opensearch
    environment:
      - cluster.name=scielo-core-local
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9209:9200"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: scielo_core_local_opensearch_dashboards
    depends_on:
      - opensearch
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    ports:
      - "5609:5601"


  celeryworker:
    <<: *django
    image: scielo_core_local_celeryworker
    container_name: scielo_core_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailhog
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: scielo_core_local_celerybeat
    container_name: scielo_core_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailhog
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: scielo_core_local_flower
    container_name: scielo_core_local_flower
    ports:
      - "5559:5555"
    command: /start-flower

volumes:
  tmp_csv_data:
  opensearch_data: